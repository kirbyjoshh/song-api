spring.application.name=student
# DataSource configuration for PostgreSQL
# For Render/Supabase, use the actual Supabase host and credentials.
# Correct examples:
# DATABASE_URL=postgresql://postgres:<YOUR_PASSWORD>@db.brgqtpmadfirljcmyujm.supabase.co:6543/postgres?sslmode=require
# DB_USERNAME=postgres
# DB_PASSWORD=<YOUR_PASSWORD>
# or
# DATABASE_URL=jdbc:postgresql://db.brgqtpmadfirljcmyujm.supabase.co:6543/postgres?sslmode=require
# DB_USERNAME=postgres
# DB_PASSWORD=<YOUR_PASSWORD>
# Do not use postgres.<user>:password@aws-1-ap-southeast-1.pooler.supabase.com as the host.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/db_song}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA/Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialect fallback: avoids 'Unable to determine Dialect without JDBC metadata' when metadata can't be read
# (note: you still need a working DB connection)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---- Server ----
# Render provides PORT; default to 8080 for local
server.port=${PORT:8080}

# ---- HikariCP ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000